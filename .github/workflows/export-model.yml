name: Export model (quantize)

on:
  workflow_dispatch:
  push:
    paths:
      - "model/**"

permissions:
  contents: write

jobs:
  quantize:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install onnx onnxruntime onnx_ir numpy huggingface_hub

      - name: Download model files
        run: |
          mkdir -p src
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil, os
          repo = "lmo3/gliner2-multi-v1-onnx"
          files = [
              "onnx/encoder.onnx", "onnx/encoder.onnx.data",
              "onnx/classifier.onnx", "onnx/classifier.onnx.data",
              "onnx/classifier_fp16.onnx", "onnx/classifier_fp16.onnx.data",
              "gliner2_config.json", "tokenizer.json", "tokenizer_config.json", "config.json",
          ]
          for f in files:
              p = hf_hub_download(repo_id=repo, filename=f)
              dst = os.path.join("src", os.path.basename(f))
              shutil.copy2(p, dst)
              print(f"{os.path.getsize(dst)/1e6:8.1f} MB  {dst}")
          PY

      - name: Quantize int8
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee -a export-log.txt
          from onnxruntime.quantization import quantize_dynamic, QuantType
          import onnx, os
          from onnx import numpy_helper

          os.makedirs("out", exist_ok=True)

          def quant(src, dst, **kw):
              quantize_dynamic(src, dst, weight_type=QuantType.QInt8, **kw)
              total = sum(
                  os.path.getsize(os.path.join("out", f))
                  for f in os.listdir("out") if f.startswith(os.path.basename(dst))
              )
              print(f"{dst}: {total/1e6:.1f} MB")
              return total

          # вариант A: per-channel по осям
          quant("src/encoder.onnx", "out/encoder_int8.onnx", per_channel=True)

          # вариант B: эмбеддинги не трогаем (исключаем Gather/MatMul в эмбеддингах)
          m = onnx.load("src/encoder.onnx", load_external_data=False)
          emb = [n.name for n in m.graph.node
                 if n.op_type in ("Gather", "MatMul") and ("embed" in n.name or "embed" in n.input[0])]
          print("excluding nodes:", len(emb), emb[:5])
          quant("src/encoder.onnx", "out/encoder_nopemb.onnx", per_channel=True, nodes_to_exclude=emb)

          # вариант C: как B, плюс 4-битные эмбеддинги (GatherBlockQuantized, block 32)
          import numpy as np
          from onnx import helper, TensorProto, numpy_helper
          from onnxruntime.quantization.matmul_nbits_quantizer import MatMulNBitsQuantizer, DefaultWeightOnlyQuantConfig

          m = onnx.load("src/encoder.onnx", load_external_data=True)
          g = m.graph
          gather = None
          for n in g.node:
              if n.op_type == "Gather" and "embed" in n.input[0]:
                  gather = n
                  break
          if gather is not None:
              cfg = DefaultWeightOnlyQuantConfig(
                  block_size=32, is_symmetric=False, bits=4,
                  op_types_to_quantize=("Gather",), quant_axes=(("Gather", 1),))
              q = MatMulNBitsQuantizer(
                  m, block_size=32, is_symmetric=False, bits=4, algo_config=cfg,
                  op_types_to_quantize=("Gather",), quant_axes=(("Gather", 1),))
              q.process()
              m = q.model.model
              onnx.save(m, "out/encoder_w4.onnx", save_as_external_data=True,
                        all_tensors_to_one_file=True, location="encoder_w4.onnx.data",
                        size_threshold=1024)
              sizes = sum(os.path.getsize(os.path.join("out", f))
                          for f in os.listdir("out") if f.startswith("encoder_w4"))
              print(f"variant C (w4 embeddings): {sizes/1e6:.1f} MB")
          else:
              print("variant C: embedding Gather не найден")

          # классификатор оставляем fp16 как есть
          for f in ("classifier_fp16.onnx", "classifier_fp16.onnx.data"):
              if os.path.exists(f"src/{f}"):
                  import shutil; shutil.copy2(f"src/{f}", f"out/{f}")
          PY
          cp src/gliner2_config.json src/tokenizer.json src/config.json out/ 2>/dev/null || true
          ls -la out

      - name: Publish failure log
        if: failure()
        run: |
          mkdir -p .ci
          { echo "=== export-log tail ==="; tail -c 30000 export-log.txt 2>/dev/null; } > .ci/model-error.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci/model-error.txt
          git commit -m "ci: model export failure log [skip ci]" || true
          git push || true

      - name: Publish model assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view model >/dev/null 2>&1 || gh release create model \
            --title "GLiNER2 multi-v1 int8 (для приложения)" \
            --notes "Квантованные int8 энкодер и классификатор + токенизатор. Собирается в CI." \
            --prerelease
          gh release upload model out/* --clobber
