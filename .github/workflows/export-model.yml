name: Export model (quantize)

on:
  workflow_dispatch:
  push:
    paths:
      - "model/**"

permissions:
  contents: write

jobs:
  quantize:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install onnx onnxruntime numpy huggingface_hub

      - name: Download model files
        run: |
          mkdir -p src
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil, os
          repo = "lmo3/gliner2-multi-v1-onnx"
          files = [
              "onnx/encoder.onnx", "onnx/encoder.onnx.data",
              "onnx/classifier.onnx", "onnx/classifier.onnx.data",
              "onnx/classifier_fp16.onnx", "onnx/classifier_fp16.onnx.data",
              "gliner2_config.json", "tokenizer.json", "tokenizer_config.json", "config.json",
          ]
          for f in files:
              p = hf_hub_download(repo_id=repo, filename=f)
              dst = os.path.join("src", os.path.basename(f))
              shutil.copy2(p, dst)
              print(f"{os.path.getsize(dst)/1e6:8.1f} MB  {dst}")
          PY

      - name: Quantize int8
        run: |
          python - <<'PY'
          from onnxruntime.quantization import quantize_dynamic, QuantType
          import onnx, os
          from onnx import numpy_helper

          os.makedirs("out", exist_ok=True)

          def quant(src, dst, **kw):
              quantize_dynamic(src, dst, weight_type=QuantType.QInt8, **kw)
              total = sum(
                  os.path.getsize(os.path.join("out", f))
                  for f in os.listdir("out") if f.startswith(os.path.basename(dst))
              )
              print(f"{dst}: {total/1e6:.1f} MB")
              return total

          # вариант A: per-channel по осям
          quant("src/encoder.onnx", "out/encoder_int8.onnx", per_channel=True)

          # вариант B: эмбеддинги не трогаем (исключаем Gather/MatMul в эмбеддингах)
          m = onnx.load("src/encoder.onnx", load_external_data=False)
          emb = [n.name for n in m.graph.node
                 if n.op_type in ("Gather", "MatMul") and ("embed" in n.name or "embed" in n.input[0])]
          print("excluding nodes:", len(emb), emb[:5])
          quant("src/encoder.onnx", "out/encoder_nopemb.onnx", per_channel=True, nodes_to_exclude=emb)

          # классификатор оставляем fp16 как есть
          for f in ("classifier_fp16.onnx", "classifier_fp16.onnx.data"):
              if os.path.exists(f"src/{f}"):
                  import shutil; shutil.copy2(f"src/{f}", f"out/{f}")
          PY
          cp src/gliner2_config.json src/tokenizer.json src/config.json out/ 2>/dev/null || true
          ls -la out

      - name: Publish model assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view model >/dev/null 2>&1 || gh release create model \
            --title "GLiNER2 multi-v1 int8 (для приложения)" \
            --notes "Квантованные int8 энкодер и классификатор + токенизатор. Собирается в CI." \
            --prerelease
          gh release upload model out/* --clobber
