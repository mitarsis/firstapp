name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.TAROT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TAROT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAROT_KEY_ALIAS }}
        run: |
          touch local.properties
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/tarot.jks
            printf 'TAROT_STORE_PASSWORD=%s\nTAROT_KEY_PASSWORD=%s\nTAROT_KEY_ALIAS=%s\n' \
              "$STORE_PASSWORD" "$STORE_PASSWORD" "${KEY_ALIAS:-tarot}" >> local.properties
            echo "ключ подписи восстановлен из секрета"
          else
            echo "секрет не задан — используется ключ из репозитория"
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --console=plain 2>&1 | tee -a build-log.txt

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l app/build/outputs/apk/debug/
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "Таро-Децидер (свежая сборка)" \
            --notes "Автоматическая сборка из main. APK: app-debug.apk" \
            --prerelease \
            app/build/outputs/apk/debug/app-debug.apk
          gh release view latest --json assets -q '.assets[].name'

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p .ci
          tail -c 30000 build-log.txt > .ci/last-error.txt || true
          cat app/build/test-results/testDebugUnitTest/*.xml >> .ci/last-error.txt 2>/dev/null || true
          { echo "=== test mismatches ==="; cat app/test-mismatches.txt 2>/dev/null; } >> .ci/last-error.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci/last-error.txt
          git commit -m "ci: capture build failure [skip ci]" || true
          git push || true

      - name: Clear stale log on success
        if: success()
        run: |
          if [ -f .ci/last-error.txt ]; then
            git rm -q --cached .ci/last-error.txt || true
            rm -f .ci/last-error.txt
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git commit -m "ci: green build, drop stale log [skip ci]" || true
            git push || true
          fi
