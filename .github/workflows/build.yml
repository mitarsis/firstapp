name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --console=plain 2>&1 | tee -a build-log.txt

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Таро-Децидер (свежая сборка)" \
            --notes "Автоматическая сборка из main. APK: app-debug.apk" \
            --prerelease
          gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p .ci
          tail -c 30000 build-log.txt > .ci/last-error.txt || true
          cat app/build/test-results/testDebugUnitTest/*.xml >> .ci/last-error.txt 2>/dev/null || true
          { echo "=== test mismatches ==="; cat app/test-mismatches.txt 2>/dev/null; } >> .ci/last-error.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci/last-error.txt
          git commit -m "ci: capture build failure [skip ci]" || true
          git push || true

      - name: Clear stale log on success
        if: success()
        run: |
          if [ -f .ci/last-error.txt ]; then
            git rm -q --cached .ci/last-error.txt || true
            rm -f .ci/last-error.txt
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git commit -m "ci: green build, drop stale log [skip ci]" || true
            git push || true
          fi
